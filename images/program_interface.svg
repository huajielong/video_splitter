<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="500" fill="#f0f0f0"/>
  
  <!-- 主窗口 -->
  <rect x="20" y="20" width="500" height="460" rx="5" ry="5" fill="#ffffff" stroke="#cccccc"/>
  <rect x="10" y="15" width="50" height="25" rx="3" ry="3" fill="#1a73e8" opacity="0.8"/>
  
  <!-- 主窗口标题 -->
  <text x="70" y="33" font-family="Arial" font-size="14" fill="#333333">视频自动拼接与移动工具</text>
  
  <!-- 按钮图标 -->
  <circle cx="540" cy="35" r="4" fill="#cccccc"/>
  <rect x="560" y="33" width="8" height="5" rx="2" ry="2" fill="#cccccc"/>
  <polygon points="585,31 595,38 585,45" fill="#cccccc"/>
  
  <!-- 文件夹配置区域 -->
  <text x="30" y="60" font-family="Arial" font-size="14" fill="#333333" font-weight="bold">文件夹配置</text>
  <text x="30" y="85" font-family="Arial" font-size="12" fill="#333333">文件夹A (视频源):</text>
  <rect x="150" y="75" width="300" height="22" rx="3" ry="3" fill="#ffffff" stroke="#cccccc"/>
  <text x="155" y="90" font-family="Arial" font-size="11" fill="#666666">E:/sora2</text>
  <rect x="460" y="75" width="50" height="22" rx="3" ry="3" fill="#e1e1e1" stroke="#cccccc"/>
  <text x="470" y="90" font-family="Arial" font-size="11" fill="#333333">浏览</text>
  
  <text x="30" y="115" font-family="Arial" font-size="12" fill="#333333">文件夹B (目标):</text>
  <rect x="150" y="105" width="300" height="22" rx="3" ry="3" fill="#ffffff" stroke="#cccccc"/>
  <text x="155" y="120" font-family="Arial" font-size="11" fill="#666666">E:/test</text>
  <rect x="460" y="105" width="50" height="22" rx="3" ry="3" fill="#e1e1e1" stroke="#cccccc"/>
  <text x="470" y="120" font-family="Arial" font-size="11" fill="#333333">浏览</text>
  
  <!-- 拼接参数设置区域 -->
  <text x="30" y="145" font-family="Arial" font-size="14" fill="#333333" font-weight="bold">拼接参数设置</text>
  <text x="30" y="170" font-family="Arial" font-size="12" fill="#333333">目标拼接时长 (10-3600秒):</text>
  <rect x="210" y="160" width="70" height="22" rx="3" ry="3" fill="#ffffff" stroke="#cccccc"/>
  <text x="215" y="175" font-family="Arial" font-size="11" fill="#333333">60</text>
  <rect x="290" y="160" width="70" height="22" rx="3" ry="3" fill="#1a73e8" stroke="#1a73e8"/>
  <text x="305" y="175" font-family="Arial" font-size="11" fill="#ffffff" font-weight="bold">60秒</text>
  <rect x="370" y="160" width="70" height="22" rx="3" ry="3" fill="#e1e1e1" stroke="#cccccc"/>
  <text x="385" y="175" font-family="Arial" font-size="11" fill="#333333">120秒</text>
  <rect x="450" y="160" width="70" height="22" rx="3" ry="3" fill="#e1e1e1" stroke="#cccccc"/>
  <text x="460" y="175" font-family="Arial" font-size="11" fill="#333333">180秒</text>
  
  <rect x="30" y="190" width="15" height="15" rx="2" ry="2" fill="#ffffff" stroke="#cccccc"/>
  <text x="50" y="203" font-family="Arial" font-size="11" fill="#333333">拼接成功后删除文件夹A中的原视频</text>
  
  <!-- 处理进度区域 -->
  <text x="30" y="230" font-family="Arial" font-size="14" fill="#333333" font-weight="bold">处理进度</text>
  <rect x="30" y="240" width="480" height="200" rx="3" ry="3" fill="#f5f5f5" stroke="#cccccc"/>
  <text x="35" y="255" font-family="Arial" font-size="11" fill="#333333">就绪</text>
  
  <!-- 模拟进度文本 -->
  <text x="35" y="275" font-family="Arial" font-size="10" fill="#666666">预处理视频...</text>
  <text x="35" y="290" font-family="Arial" font-size="10" fill="#666666">正在处理: 跳过预处理3个已满足条件的视频文件</text>
  <text x="35" y="305" font-family="Arial" font-size="10" fill="#666666">开始拼接视频序列...</text>
  
  <!-- 开始处理按钮 -->
  <rect x="30" y="455" width="100" height="30" rx="3" ry="3" fill="#1a73e8" stroke="#1a73e8"/>
  <text x="60" y="473" font-family="Arial" font-size="12" fill="#ffffff" font-weight="bold">开始处理</text>
  
  <!-- 结果弹窗 -->
  <rect x="540" y="150" width="240" height="250" rx="5" ry="5" fill="#ffffff" stroke="#cccccc"/>
  <rect x="530" y="145" width="30" height="30" rx="3" ry="3" fill="#e1e1e1" opacity="0.8"/>
  
  <!-- 结果弹窗标题 -->
  <text x="560" y="172" font-family="Arial" font-size="14" fill="#333333">处理结果</text>
  
  <!-- 信息图标 -->
  <circle cx="555" y="190" r="12" fill="#e3f2fd" stroke="#1a73e8"/>
  <text x="552" y="195" font-family="Arial" font-size="16" fill="#1a73e8" font-weight="bold">i</text>
  
  <!-- 结果文本 -->
  <text x="575" y="195" font-family="Arial" font-size="12" fill="#333333" font-weight="bold">处理完成!</text>
  <text x="565" y="215" font-family="Arial" font-size="10" fill="#666666">- 总处理耗时: 0分23.1秒</text>
  <text x="565" y="230" font-family="Arial" font-size="10" fill="#666666">- 目标拼接时长: 60秒</text>
  <text x="565" y="245" font-family="Arial" font-size="10" fill="#666666">- 预处理: 成功生成4个画布版视频</text>
  <text x="565" y="260" font-family="Arial" font-size="10" fill="#666666">- 清理: 0个损坏文件、0个空文件</text>
  <text x="565" y="275" font-family="Arial" font-size="10" fill="#666666">- 帧处理耗时: 0分4.7秒</text>
  <text x="565" y="290" font-family="Arial" font-size="10" fill="#666666">- 拼接结果: 成功拼接1个视频</text>
  <text x="565" y="305" font-family="Arial" font-size="10" fill="#666666">- 所有拼接视频时长: 1分19.5秒</text>
  
  <!-- 确定按钮 -->
  <rect x="660" y="370" width="80" height="25" rx="3" ry="3" fill="#1a73e8" stroke="#1a73e8"/>
  <text x="685" y="386" font-family="Arial" font-size="11" fill="#ffffff" font-weight="bold">确定</text>
</svg>